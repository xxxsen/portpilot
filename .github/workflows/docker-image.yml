name: docker-image

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: portpilot-server
            file: docker/Dockerfile.server
          - image: portpilot-client
            file: docker/Dockerfile.client
          - image: portpilot-web
            file: web/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - id: metadata
        run: git show -s --format='build_time=%cI' "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.metadata.outputs.build_time }}
          tags: |
            ${{ secrets.DOCKER_USER }}/${{ matrix.image }}:${{ github.ref_name }}
            ${{ secrets.DOCKER_USER }}/${{ matrix.image }}:latest

name: acceptance

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Web dependencies
        run: make web-install
      - name: Install Playwright Chromium
        run: npx --prefix web playwright install --with-deps chromium
      - name: Run merge acceptance
        env:
          ACCEPT_SOAK_DURATION: 15m
          ACCEPT_CHAOS_INTERVAL: 2m
        run: make acceptance
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: acceptance-failure
          path: |
            .dev-data/logs
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
